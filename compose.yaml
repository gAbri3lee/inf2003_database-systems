services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hdb
      POSTGRES_PASSWORD: hdb
      POSTGRES_DB: hdb
    ports: ['127.0.0.1:5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  mongo:
    image: mongo:8.0
    ports: ['127.0.0.1:27017:27017']
    volumes: [mongodata:/data/db]
volumes:
  pgdata:
  mongodata:
