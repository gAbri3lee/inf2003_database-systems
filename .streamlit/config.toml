# App-wide look. Streamlit reads this automatically on start-up.

[client]
toolbarMode = "minimal"        # hide the Deploy button / developer menu

[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
borderColor = "#E2E8F0"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]
# Charts with an "engine" series: columns sort alphabetically, so this maps
# mongodb -> green, postgres -> blue, shared -> grey.
chartCategoricalColors = ["#16A34A", "#2563EB", "#94A3B8", "#F59E0B", "#0F766E", "#E11D48"]

[theme.sidebar]
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#E2E8F0"
borderColor = "#334155"
